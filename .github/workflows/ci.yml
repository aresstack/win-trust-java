name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: JDK 8 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # The artifact targets Java 8, so the whole build (compile, tests, sources and javadoc
      # jars) runs on a real JDK 8 and on the Maven version pinned by the Maven Wrapper
      # (.mvn/wrapper), the same one the release uses. GPG signing only happens in the release.
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw -B clean verify -Dgpg.skip=true

      # The Gradle wrapper (8.14.3) is the second supported build path and must keep running on JDK 8.
      - name: Gradle build path (Linux)
        if: runner.os != 'Windows'
        run: ./gradlew test --no-daemon

      # On Windows the real certificate-store export is exercised against the runner's own
      # Root/Intermediate stores (powershell.exe -Command, no temporary .ps1).
      # bash, not pwsh: PowerShell splits '-Dgpg.skip=true' into '-Dgpg' and '.skip=true'.
      - name: Build and test (Windows, real certificate stores)
        if: runner.os == 'Windows'
        shell: bash
        run: ./mvnw -B clean verify -Dgpg.skip=true -Dwintrust.integration=true -Dwintrust.diagnostics=true
