name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Publishing to Central is irreversible, so the release first proves the exact revision on both
  # platforms, including the real inline PowerShell export on Windows (the opt-in integration tests).
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and test (real Windows export on Windows)
        shell: bash
        run: ./mvnw -B clean verify -Dgpg.skip=true -Dwintrust.integration=true -Dwintrust.diagnostics=true

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Everything that can be wrong about the version is checked BEFORE the irreversible deploy:
      # a pushed tag must name the pom version, and a manual run must not re-release a version
      # whose tag already exists.
      - name: Determine the version and check the tag
        id: version
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          test -n "$version"
          echo "Releasing version ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the pom.xml version ${version}" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists; bump the version in pom.xml and build.gradle first" >&2
            exit 1
          fi

      # The release runs on the Maven version pinned by the Maven Wrapper (.mvn/wrapper), not on
      # the runner's preinstalled Maven: Maven 3.10.0 leaves a maven-metadata-local.xml in the
      # Central staging bundle and Central rejects it ("Bundle has content that does NOT have a
      # .pom file"); central-publishing-maven-plugin 0.9.0 only cleans up the 3.9.x metadata file.
      - name: Publish
        run: ./mvnw -B clean deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Manual runs (workflow_dispatch) deploy the version from pom.xml and then create the
      # matching v<version> tag themselves. A tag pushed with GITHUB_TOKEN does not trigger
      # this workflow again, so the artifact is deployed exactly once.
      - name: Tag the released version
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" -m "Release v${version}"
          git push origin "v${version}"
