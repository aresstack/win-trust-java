name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    name: JDK 8 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # The artifact targets Java 8, so the whole build (compile, tests, sources and javadoc
      # jars) runs on a real JDK 8. GPG signing only happens in the release workflow.
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: mvn -B clean verify -Dgpg.skip=true

      # On Windows the real certificate-store export is exercised against the runner's own
      # Root/Intermediate stores (powershell.exe -Command, no temporary .ps1).
      - name: Build and test (Windows, real certificate stores)
        if: runner.os == 'Windows'
        run: mvn -B clean verify -Dgpg.skip=true -Dwintrust.integration=true -Dwintrust.diagnostics=true
